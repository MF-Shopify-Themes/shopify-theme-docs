<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="alternate icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">

{% if page.url contains '/arcanum/' or page.path contains 'arcanum/' %}
<!-- Arcanum Mystical Grimoire Fonts & Stylesheet -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/arcanum-docs.css' | relative_url }}">
<script>
  document.documentElement.classList.add('arcanum-docs');
  document.addEventListener('DOMContentLoaded', function() {
    if (document.body) document.body.classList.add('arcanum-docs');
  });
</script>
{% endif %}
