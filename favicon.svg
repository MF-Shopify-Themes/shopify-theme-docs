  </defs>
  
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-1.5" text-anchor="middle" fill="url(#textGrad)" filter="url(#glow)">MF</text>
